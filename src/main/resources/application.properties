spring.application.name=memoapp
# Render などの公開先では、向こうが決めたポート（PORT）で待ち受けます。自宅では 8080 です。
server.port=${PORT:8080}

# データベース（MySQL）の接続先です。
# 本番（Render）では環境変数 DB_URL / DB_USERNAME / DB_PASSWORD で渡します。
# パスワードをこのファイルや GitHub に書かないための仕組みです。
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/memo_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# テーブルがなければ自動で作り、列の追加にも追随します（学習用の設定です）。
spring.jpa.hibernate.ddl-auto=update
